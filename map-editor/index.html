<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZH Map Editor</title>
  </head>
  <body class="overflow-hidden bg-slate-950 text-slate-200 antialiased">
    <div id="app" class="grid h-full grid-cols-[16rem_minmax(0,1fr)_18rem] grid-rows-[auto_1fr_auto]">
      <header id="toolbar" class="col-span-3 border-b border-slate-800 bg-slate-900/90"></header>

      <aside
        id="sidebar-left"
        class="flex flex-col gap-2 overflow-y-auto border-r border-slate-800 bg-slate-900/40 p-2.5"
      ></aside>

      <main id="canvas-wrap" class="relative min-w-0 overflow-hidden bg-[#0b0f16]">
        <canvas id="canvas" class="block h-full w-full cursor-crosshair"></canvas>
      </main>

      <aside
        id="sidebar-right"
        class="flex flex-col gap-2 overflow-y-auto border-l border-slate-800 bg-slate-900/40 p-2.5"
      ></aside>

      <footer
        id="status"
        class="col-span-3 truncate border-t border-slate-800 bg-slate-900/90 px-4 py-2 text-xs text-slate-400"
      ></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
