name: CI

on:
  push:
    branches: [main, master, 3d]
  pull_request:
    branches: [main, master, 3d]

jobs:
  linux-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl zip unzip tar pkg-config \
            libvulkan-dev mesa-vulkan-drivers libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev git

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/packages
            vcpkg/buildtrees
            vcpkg/downloads
            game/build/cmake-vk/vcpkg_installed
          key: vcpkg-linux-${{ hashFiles('game/vcpkg.json') }}
          restore-keys: vcpkg-linux-

      - name: Build game (CMake + vcpkg + Vulkan)
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_TARGET_TRIPLET: x64-linux
        run: |
          chmod +x game/scripts/*.sh
          if [[ ! -x "$VCPKG_ROOT/vcpkg" ]]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
          game/scripts/build.sh

      - name: Verify binary
        run: test -x game/bin/Release/zh_game

  linux-map-editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: map-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: map-editor/package-lock.json
      - run: npm ci
      - run: npm run build

  windows-game:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/packages
            vcpkg/buildtrees
            vcpkg/downloads
            game/build/cmake-vk/vcpkg_installed
          key: vcpkg-windows-${{ hashFiles('game/vcpkg.json') }}
          restore-keys: vcpkg-windows-

      - name: Build game (CMake + vcpkg + Vulkan)
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          & game\scripts\build.bat
          if ($LASTEXITCODE -ne 0) { throw "build.bat failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path game\bin\Release\zh_game.exe)) {
            throw "Missing game\bin\Release\zh_game.exe"
          }
