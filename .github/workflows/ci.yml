name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  linux-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev curl
      - name: Install Premake 5
        run: |
          PREMAKE_VERSION=5.0.0-beta8
          curl -fsSL \
            "https://github.com/premake/premake-core/releases/download/v${PREMAKE_VERSION}/premake-${PREMAKE_VERSION}-linux.tar.gz" \
            | tar xz
          sudo install -m 755 premake5 /usr/local/bin/premake5
          premake5 --version
      - name: Build game
        run: |
          chmod +x game/scripts/*.sh
          game/scripts/build.sh
      - name: Verify binary
        run: test -x game/bin/Release/zh_game

  linux-map-editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: map-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: map-editor/package-lock.json
      - run: npm ci
      - run: npm run build

  windows-game:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain make
      - name: Build game
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd game/build
          ./premake5.exe gmake
          cd ..
          mingw32-make config=release_x64 -j"$(nproc)"
          mkdir -p bin/Release/resources bin/Release/maps
          cp -a resources/. bin/Release/resources/
          cp -a maps/. bin/Release/maps/
          if objdump -p bin/Release/zh_game.exe | grep -Eiq 'libgcc_s_seh|libstdc\+\+-6|libwinpthread'; then
            echo "error: zh_game.exe still depends on MinGW runtime DLLs" >&2
            exit 1
          fi
      - name: Verify binary
        shell: pwsh
        run: |
          if (-not (Test-Path game/bin/Release/zh_game.exe)) {
            throw "Missing game/bin/Release/zh_game.exe"
          }
