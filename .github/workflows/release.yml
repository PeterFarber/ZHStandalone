# Manual release: build Linux + Windows game binaries, publish one GitHub Release.
# GitHub → Actions → "Release game" → Run workflow (pick branch, enter tag e.g. v0.1.0).

name: Release game

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
        type: string
      draft:
        description: Create as draft release
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark as pre-release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl zip unzip tar pkg-config \
            libvulkan-dev mesa-vulkan-drivers libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev git

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/packages
            vcpkg/buildtrees
            vcpkg/downloads
            game/build/cmake-vk/vcpkg_installed
          key: vcpkg-linux-${{ hashFiles('game/vcpkg.json') }}
          restore-keys: vcpkg-linux-

      - name: Build release
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_TARGET_TRIPLET: x64-linux
        run: |
          chmod +x game/scripts/*.sh
          if [[ ! -x "$VCPKG_ROOT/vcpkg" ]]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
          game/scripts/build.sh
          cp LICENSE game/bin/Release/LICENSE
          test -x game/bin/Release/zh_game

      - name: Package tar.gz
        run: |
          cd game/bin/Release
          tar czf ../../../zh_game-linux-x64.tar.gz *

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: zh_game-linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/packages
            vcpkg/buildtrees
            vcpkg/downloads
            game/build/cmake-vk/vcpkg_installed
          key: vcpkg-windows-${{ hashFiles('game/vcpkg.json') }}
          restore-keys: vcpkg-windows-

      - name: Build release (CMake + vcpkg + Vulkan)
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          & game\scripts\build.bat
          if ($LASTEXITCODE -ne 0) { throw "build.bat failed with exit code $LASTEXITCODE" }
          Copy-Item LICENSE game\bin\Release\LICENSE
          if (-not (Test-Path game\bin\Release\zh_game.exe)) {
            throw "Missing game\bin\Release\zh_game.exe"
          }

      - name: Package zip
        shell: pwsh
        run: |
          Push-Location game/bin/Release
          tar -a -cf ../../../zh_game-windows-x64.zip *
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: zh_game-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/zh_game-linux-x64.tar.gz
            dist/zh_game-windows-x64.zip
          body: |
            ## Downloads

            | Platform | File | Run |
            |----------|------|-----|
            | **Linux** (x64) | `zh_game-linux-x64.tar.gz` | Extract, then `./zh_game` |
            | **Windows** (x64) | `zh_game-windows-x64.zip` | Extract, then `zh_game.exe` |

            Each archive includes `resources/`, `maps/`, runtime DLLs (Windows), and `LICENSE` beside the executable.

            Requires a **Vulkan 1.x** capable GPU and driver. Linux also needs X11 (or compatible) libraries installed.
